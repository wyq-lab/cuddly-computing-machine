name: Full CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Sync content
        run: pnpm run sync
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: pnpm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate diff for review
        run: |
          git diff origin/${{ github.base_ref || 'master' }}...HEAD > /tmp/diff.txt 2>/dev/null || \
          git diff HEAD~1 > /tmp/diff.txt

      - name: DeepSeek Security Review
        run: |
          DIFF=$(cat /tmp/diff.txt | head -c 6000 | jq -Rs .)

          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -d "{
              \"model\": \"deepseek-chat\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"你是安全审查专家。审查以下代码变更中的安全问题：\n1. SQL注入/XSS/CSRF\n2. 敏感信息泄露\n3. 不安全的依赖\n4. 权限问题\n\n如发现高危问题行首标注【Critical】。用中文 Markdown 输出。\"
                },
                {
                  \"role\": \"user\",
                  \"content\": ${DIFF}
                }
              ],
              \"max_tokens\": 4096,
              \"temperature\": 0.3
            }")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // .error.message')
          echo "$REVIEW" > /tmp/security-output.md
          cat /tmp/security-output.md

          if grep -qiE "(Critical|CRITICAL|【Critical】|高危)" /tmp/security-output.md; then
            echo "::error::发现高危安全问题，请修复后重新提交"
            exit 1
          fi

      - name: Post Security Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewFile = '/tmp/security-output.md';
            if (!fs.existsSync(reviewFile)) return;
            const body = fs.readFileSync(reviewFile, 'utf-8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DeepSeek Security Review\n\n${body}`
            });
