name: Security Review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prisma/**'

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: DeepSeek Security Review
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.txt 2>/dev/null || \
          git diff HEAD~1 > /tmp/diff.txt

          DIFF=$(cat /tmp/diff.txt | head -c 6000 | jq -Rs .)

          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -d "{
              \"model\": \"deepseek-chat\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"你是安全审查专家。审查以下代码变更的安全问题：SQL注入、XSS、CSRF、敏感信息泄露、不安全的依赖、权限问题。如发现高危问题行首标注【Critical】。用中文Markdown输出。\"
                },
                {
                  \"role\": \"user\",
                  \"content\": ${DIFF}
                }
              ],
              \"max_tokens\": 4096,
              \"temperature\": 0.3
            }")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // .error.message')
          echo "$REVIEW" > /tmp/security-output.md
          cat /tmp/security-output.md

          if grep -qiE "(Critical|CRITICAL|【Critical】|高危)" /tmp/security-output.md; then
            echo "::error::发现高危安全问题，阻止合并"
            exit 1
          fi

      - name: Post Security Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewFile = '/tmp/security-output.md';
            if (!fs.existsSync(reviewFile)) return;
            const body = fs.readFileSync(reviewFile, 'utf-8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DeepSeek Security Review\n\n${body}`
            });
