name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr_diff.txt
          else
            PR_NUMBER=${{ github.event.issue.number }}
            PR_DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            BASE_REF=$(echo "$PR_DATA" | jq -r '.base.ref')
            HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
            git fetch origin "$BASE_REF" "$HEAD_REF"
            git diff "origin/$BASE_REF...origin/$HEAD_REF" > /tmp/pr_diff.txt
          fi
          echo "Diff size: $(wc -l < /tmp/pr_diff.txt) lines"

      - name: DeepSeek Code Review
        id: review
        run: |
          DIFF=$(cat /tmp/pr_diff.txt | head -c 8000 | jq -Rs .)

          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -d "{
              \"model\": \"deepseek-chat\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"你是代码审查专家。请审查以下 PR diff，用中文输出：\n1. 代码质量问题\n2. 潜在 Bug\n3. 安全漏洞（如有高危问题请在行首标注【Critical】）\n4. 改进建议\n\n用 Markdown 格式输出。如果没有问题请说明。\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"请审查这个 PR：\n\n\`\`\`diff\n${DIFF}\n\`\`\`\"
                }
              ],
              \"max_tokens\": 4096,
              \"temperature\": 0.3
            }")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // .error.message')
          echo "$REVIEW" > /tmp/review-output.md
          echo "review_done=true" >> "$GITHUB_OUTPUT"

      - name: Post Review as PR Comment
        if: steps.review.outputs.review_done == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('/tmp/review-output.md', 'utf-8');
            const hasCritical = /(?:Critical|CRITICAL|【Critical】|高危)/.test(reviewBody);

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DeepSeek Code Review\n\n${reviewBody}\n\n---\n${
                hasCritical
                  ? ':warning: **高危问题已发现，合并已被阻止。** 请修复后重新提交。'
                  : ':white_check_mark: 未发现高危问题。'
              }\n\n> 在PR评论中输入 \`@claude\` 可请求重新审查。`
            });

            if (hasCritical) {
              core.setFailed('高危安全问题发现，阻止合并');
            }
